<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Sprout Stem & Leaves Group -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <!-- Soil / Root Base Arc -->
    <path d="M156 380 C180 340 332 340 356 380 C310 405 202 405 156 380 Z" fill="#FFFFFF" fill-opacity="0.25"/>
    
    <!-- Central Growing Stem -->
    <path d="M256 370 C256 260 252 200 256 160" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Right Vibrant Sprout Leaf -->
    <path d="M256 260 C290 260 370 240 380 170 C310 160 270 210 256 260 Z" fill="url(#leafGrad)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Left Caring Leaf -->
    <path d="M256 220 C220 220 142 195 132 125 C202 115 242 165 256 220 Z" fill="#6EE7B7" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>

    <!-- Floating Family Heart Core -->
    <path d="M256 135 C248 120 226 116 216 130 C202 148 220 174 256 200 C292 174 310 148 296 130 C286 116 264 120 256 135 Z" fill="url(#heartGrad)" stroke="#FFFFFF" stroke-width="6"/>
  </g>
</svg>
